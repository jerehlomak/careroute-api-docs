openapi: 3.1.0

info:
  title: CareRoute Auth & Data API
  version: "2026.09.30"
  description: |
    Backend API for the **CareRoute React Native app**. The RN app never calls
    Salesforce directly — every read and write goes through this Express/TypeScript
    service, which holds the Salesforce integration-user credentials and proxies
    each request to the appropriate Apex REST endpoint in the CareRoute Salesforce
    org. Firebase Authentication + Firestore are used for phone/OTP verification
    and password credential storage; Salesforce is the system of record for
    Contacts, Accounts, subscriptions, wallets, and medical records.

    ## Two-step token flow (required reading before calling anything else)

    Every sign-in path (`POST /otp/verify` or `POST /login`) returns a Firebase
    **custom token** in the response body — this is NOT a usable API credential by
    itself. The RN app must feed that custom token into the Firebase Auth SDK's
    `signInWithCustomToken()`, which exchanges it for a real Firebase **ID token**
    (a JWT). It is that ID token — not the custom token — that goes in the
    `Authorization: Bearer <idToken>` header on every other endpoint below that
    requires authentication. Sending the raw custom token as a Bearer token will
    fail `admin.auth().verifyIdToken()` on the server and return 401.

    Once a user completes `POST /register` (as a sponsor) or `POST /dependent/claim`
    (as a claimed dependent), the server attaches `contactId`, `accountId`, and
    `role` as Firebase custom claims on that user. These claims are baked into every
    ID token minted for that user from then on (the RN app may need to force-refresh
    its cached ID token after registering/claiming to pick them up). See
    `CallerIdentity` under Components → Schemas for what these claims mean — every
    endpoint tagged "Account Data (Tier 1)", "My Profile", or "Dependents" (register)
    depends on them being present, and returns `403 Registration incomplete` if
    they're missing.

    ## Known current limitations (affect API consumers directly)

    - **Subscription status reflects the account's current subscription.**
      `GET /subscription/status` returns `status` (`Active`, `Pending`,
      `Paused/ Suspended`, `Expired` or `Cancelled`), `planType`,
      `visitsRemaining` and `renewalDate`. A newly registered sponsor starts as
      `Pending` until the subscription is activated. To decide whether the app
      should offer "request care", use `GET /care-requests/eligibility` and its
      `reasonCode`; do not branch on the raw `status` string.
    - **Medical record access for Doctor/Nurse roles is reachable, and strictly
      scoped per patient.** `POST /provider/claim` creates a Firebase account
      for a pre-vetted Doctor/Nurse; `GET /me` and `GET /medical-record` gate on
      `contactId` alone (not `contactId`+`accountId`, which providers never have
      — see `CallerIdentity`), so a claimed provider's token is not rejected
      before the server's own authorization runs. That authorization decides
      per patient: a Doctor/Nurse can view a patient's record only if that
      patient has an existing visit attended by that provider. There is no
      endpoint in this API to create that link; it must already exist.
    - **Wallet balance is Sponsor-role only.** `GET /wallet/balance` returns `403`
      for any caller whose role isn't Sponsor (e.g. a claimed dependent), since
      dependents don't hold their own wallet.

  contact:
    name: CareRoute Engineering

servers:
  - url: "https://careroute-firebase.onrender.com"
    description: Production (Render).
  # Local development note (not a live server, kept here for context only):
  # This project previously ran locally against the Firebase Functions emulator
  # (`npm run serve` inside functions/, serving from a
  # 127.0.0.1:5001/<project>/<region>/api style URL). As of the Render migration
  # reflected in functions/src/index.ts (a plain `express().listen(process.env.PORT)`
  # app, no more firebase-functions `onRequest` wrapper), the project deploys via
  # Render only — there is no supported local emulator flow anymore. To run it
  # locally today, set the required env vars (FIREBASE_SERVICE_ACCOUNT_JSON,
  # SF_JWT_PRIVATE_KEY, SF_CONSUMER_KEY, SF_INTEGRATION_USERNAME, AT_API_KEY,
  # AT_USERNAME) and run the compiled server directly on a port of your choosing.

security: []

tags:
  - name: OTP
    description: Phone-based one-time-code sign-in. No Authorization header required.
  - name: Password
    description: Log in with phone + password, and recover a forgotten password.
  - name: Sponsor Registration
    description: Turn a verified Firebase account into a Salesforce Sponsor, with a password.
  - name: Dependents
    description: >-
      Sponsors register dependents by phone number; each dependent later claims
      their own profile under a SEPARATE Firebase identity (their own phone, their
      own OTP + ID token) — never the sponsor's.
  - name: Providers
    description: >-
      Doctors/Nurses claim a pre-vetted profile under a SEPARATE Firebase
      identity, analogous to Dependents — except there is no self-serve
      registration endpoint here at all; the underlying provider profile
      must already exist and be vetted.
  - name: My Profile
    description: The caller's own Salesforce profile.
  - name: Push Notifications
    description: >-
      Registering a device token is a normal call any signed-in identity can
      make. Actually sending a push is NOT part of the mobile API surface —
      it's called server-to-server by Salesforce's PushNotificationSender,
      authenticated by a shared secret instead of a Firebase ID token.
  - name: Wallet
    description: Wallet balance, top-ups and transaction history. Sponsor-role only.
  - name: Care Requests
    description: Care request eligibility pre-check and creation.
  - name: Account Data (Tier 1)
    description: Read-only account data proxied to Salesforce, gated on the caller's CallerIdentity claims.
  - name: Health Checks
    description: Unauthenticated liveness/connectivity checks.

paths:
  /health:
    get:
      tags: [Health Checks]
      operationId: getHealth
      summary: Liveness check
      description: >-
        Basic liveness check for the Express app itself — touches no external
        dependencies. Nothing needs to happen before calling this.
      security: []
      responses:
        "200":
          description: The service is up.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
              example:
                status: ok
                time: "2026-09-01T12:00:00.000Z"

  /sf-health:
    get:
      tags: [Health Checks]
      operationId: getSalesforceHealth
      summary: Salesforce connectivity check
      description: >-
        Confirms the server can reach Salesforce end to end: it authenticates to
        Salesforce and calls Salesforce's `/limits` endpoint. No Authorization
        header is required. Useful as a first diagnostic step whenever a 502
        shows up elsewhere.
      security: []
      responses:
        "200":
          description: Salesforce JWT Bearer exchange succeeded.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SalesforceHealthStatus"
              example:
                status: connected
                instanceUrl: "https://instance.example.com"
                sampleLimit: 15000
        "500":
          description: The JWT Bearer exchange or the Salesforce `/limits` call failed.
          content:
            application/json:
              schema:
                type: object
                required: [status, message]
                properties:
                  status: { type: string, const: error }
                  message: { type: string }
              example:
                status: error
                message: "Salesforce JWT Bearer exchange failed: 400 invalid_grant"

  /otp/request:
    post:
      tags: [OTP]
      operationId: requestOtp
      summary: Send a phone verification code
      description: >-
        Sends a 6-digit SMS verification code (via Africa's Talking) to `phone`.
        The code expires after 5 minutes and is rate-limited to one request per
        phone number per 60 seconds. This is the entry point of both the Sponsor
        and the Dependent sign-in flows — nothing needs to happen before calling
        it.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [phone]
              properties:
                phone:
                  type: string
                  description: E.164 phone number to send the code to.
                  example: "+231770000001"
            example:
              phone: "+231770000001"
      responses:
        "200":
          description: Code sent.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessResponse"
              example:
                success: true
        "400":
          description: "`phone` was missing from the request body."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                error: phone is required
        "429":
          description: A code was already requested for this phone number within the last 60 seconds.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                error: Please wait before requesting another code

  /otp/verify:
    post:
      tags: [OTP]
      operationId: verifyOtp
      summary: Verify a phone code and receive a custom token
      description: >-
        Verifies the code sent by `POST /otp/request` for the same `phone`. On
        success, finds or creates the Firebase Auth user for this phone number and
        returns a Firebase **custom token** — see the top-level "Two-step token
        flow" note: this must be exchanged client-side for a real ID token before
        it can be used as a Bearer credential anywhere else in this API.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [phone, code]
              properties:
                phone:
                  type: string
                  description: The same E.164 phone number a code was requested for.
                  example: "+231770000001"
                code:
                  type: string
                  description: The 6-digit code received by SMS.
                  example: "482913"
            example:
              phone: "+231770000001"
              code: "482913"
      responses:
        "200":
          description: Code verified.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CustomTokenResponse"
              example:
                customToken: "eyJhbGciOiJSUzI1NiIsInR5cCI6IkpXVCJ9.<...firebase-custom-token...>"
        "400":
          description: Missing fields, or the code was wrong/expired/exhausted/never requested.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              examples:
                missingFields:
                  summary: phone or code missing
                  value: { error: "phone and code are required" }
                noCode:
                  summary: No code was ever requested for this phone
                  value: { error: "No verification code found — request a new one" }
                expired:
                  summary: Code expired (>5 minutes old)
                  value: { error: "Verification code expired — request a new one" }
                tooManyAttempts:
                  summary: 5th wrong attempt — code invalidated
                  value: { error: "Too many attempts — request a new code" }
                wrongCode:
                  summary: Code doesn't match
                  value: { error: "Incorrect code" }

  /login:
    post:
      tags: [Password]
      operationId: login
      summary: Log in with phone + password
      description: >-
        Standalone phone + password login for returning users who already have a
        password set (via `POST /register` or `POST /dependent/claim`). Locks the
        account for 15 minutes after 5 consecutive failed attempts. Like
        `POST /otp/verify`, the returned custom token must be exchanged for an ID
        token before use as a Bearer credential.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [phone, password]
              properties:
                phone:
                  type: string
                  example: "+231770000001"
                password:
                  type: string
                  example: "SuperSecret123!"
            example:
              phone: "+231770000001"
              password: "SuperSecret123!"
      responses:
        "200":
          description: Credentials valid.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CustomTokenResponse"
              example:
                customToken: "eyJhbGciOiJSUzI1NiIsInR5cCI6IkpXVCJ9.<...firebase-custom-token...>"
        "400":
          description: "`phone` or `password` missing from the request body."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                error: phone and password are required
        "401":
          description: No credential record for this phone, wrong password, or the account is temporarily locked.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              examples:
                invalid:
                  summary: No matching phone, or wrong password
                  value: { error: "Invalid credentials" }
                locked:
                  summary: 5 failed attempts within the lockout window
                  value: { error: "Account temporarily locked — try again later" }

  /recover/reset-password:
    post:
      tags: [Password]
      operationId: resetPassword
      summary: Reset password via verified phone ownership
      description: >-
        Resets the password for the account tied to the verified phone number on
        the presented ID token, without requiring the old password. Requires a
        FRESH ID token from a completed OTP verify → custom-token exchange,
        proving the caller currently owns the phone number — that proof-of-phone
        is how recovery is authenticated here.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [newPassword]
              properties:
                newPassword:
                  type: string
                  minLength: 8
                  example: "AnotherSecret456!"
            example:
              newPassword: "AnotherSecret456!"
      responses:
        "200":
          description: Password reset.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessResponse"
              example:
                success: true
        "400":
          description: newPassword missing/too short, or the token has no verified phone number.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              examples:
                badPassword:
                  value: { error: "newPassword is required and must be at least 8 characters" }
                noPhone:
                  value: { error: "No verified phone number on this account" }
        "401":
          $ref: "#/components/responses/Unauthorized"

  /register:
    post:
      tags: [Sponsor Registration]
      operationId: registerSponsor
      summary: Register the caller as a Sponsor
      description: >-
        Registers the caller as a Sponsor in Salesforce, then — only if that
        succeeds — sets the account's
        password locally and attaches `contactId`, `accountId`, and `role` as
        Firebase custom claims (see `CallerIdentity`) on the user. `firstName`,
        `country`, and `password` are required; `phone` in the body is only used
        as a fallback if the ID token itself has no verified `phone_number`.

        Salesforce registration is the gate: if it fails (502), nothing else
        happens and no password is stored. Custom claims are only set after both
        the Salesforce call and the password write succeed — an ID token obtained
        BEFORE this call completes won't carry them yet, so the RN app should
        force-refresh (or re-run the token exchange) afterward to get a token that
        satisfies the `CallerIdentity` checks on every other protected endpoint.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [firstName, country, password]
              properties:
                firstName: { type: string, example: "John" }
                lastName: { type: string, example: "Doe" }
                email: { type: string, format: email, example: "johndoe@example.com" }
                city: { type: string, example: "Monrovia" }
                country: { type: string, example: "Liberia" }
                phone:
                  type: string
                  description: >-
                    Fallback phone number, only used if the ID token has no
                    verified phone_number claim.
                  example: "+231770000001"
                password:
                  type: string
                  minLength: 8
                  example: "SuperSecret123!"
            example:
              firstName: "John"
              lastName: "Doe"
              email: "johndoe@example.com"
              city: "Monrovia"
              country: "Liberia"
              phone: "+231770000001"
              password: "SuperSecret123!"
      responses:
        "200":
          description: Sponsor registered in Salesforce and password set.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RegistrationResult"
              example:
                contactId: "003XX000004TmiQQAS"
                accountId: "001XX000003DHPh QAO"
                role: "Sponsor"
                wasExisting: false
        "400":
          description: A required field is missing, or password is too short.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              examples:
                missingFields:
                  value: { error: "Missing required fields: phone (or verified token phone), firstName, country, and password are all required" }
                shortPassword:
                  value: { error: "password must be at least 8 characters" }
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          description: Unexpected error contacting Salesforce, or Salesforce succeeded but the local password write failed.
          content:
            application/json:
              schema:
                anyOf:
                  - $ref: "#/components/schemas/Error"
                  - $ref: "#/components/schemas/PartialSuccessError"
              examples:
                sfError:
                  summary: Could not reach Salesforce at all
                  value: { error: "Internal error contacting Salesforce" }
                passwordWriteFailed:
                  summary: Salesforce Contact was created but the password could not be stored
                  value:
                    error: "Account created but password could not be set — please try setting your password again"
                    contactId: "003XX000004TmiQQAS"
        "502":
          description: The Salesforce Apex REST call itself returned a non-2xx response.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorWithDetail"
              example:
                error: "Registration failed on Salesforce side"
                detail: "{\"message\":\"DUPLICATE_VALUE\"}"

  /care-requests:
    get:
      tags: [Care Requests]
      operationId: listCareRequests
      summary: List the caller's care requests
      description: |-
        A **Sponsor** sees the requests of their account; a **Patient** sees only their own. Doctor and Nurse tokens get 403. A request that does not exist, is not yours, or has a malformed id returns the identical 404.

        Newest first, cursor-paginated. Pass `nextCursor` back unchanged as `cursor`; it is `null` on the last page. Status values: `Submitted`, `Dispatched`, `Provider Accepted`, `Provider Arrived/ In Progress`, `Complete`, `Escalated`, `Cancelled` (exact, case-sensitive). Show wording from the value; do not parse it.

        **provider** is `{ name, type, rating }` once someone is assigned, otherwise `null`. It never includes a phone number or location. Treat `null` as "no provider yet". **Items never include symptoms or the confirmation code**; use the detail call for those.
      security:
        - bearerAuth: []
      parameters:
        - { name: limit, in: query, required: false, schema: { type: integer, minimum: 1, maximum: 50, default: 20 } }
        - { name: cursor, in: query, required: false, description: Opaque; the nextCursor of the previous page., schema: { type: string } }
        - name: status
          in: query
          required: false
          schema:
            type: string
            enum: [Submitted, Dispatched, Provider Accepted, "Provider Arrived/ In Progress", Complete, Escalated, Cancelled]
      responses:
        "200":
          description: A page of requests.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CareRequestList"
              example: { items: [ { id: "a2vXX000001AbCdYAK", status: "Dispatched", createdAt: "2026-09-30T08:15:00.000Z", patient: { id: "003XX00001PhybaYAB", name: "Anthony Doe" }, provider: { name: "Dora Doc", type: "Doctor", rating: 4.5 } } ], nextCursor: null }
        "400":
          description: Invalid limit, cursor or status.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CareRequestError"
              example: { error: "Invalid query parameter: status", code: "INVALID_REQUEST" }
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          description: Registration incomplete, or not a Sponsor or Patient.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example: { error: "This action requires the Sponsor or Patient role" }
        "500":
          $ref: "#/components/responses/InternalError"
        "502":
          description: Salesforce returned an unexpected error. The upstream body is not forwarded.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example: { error: "Failed to fetch care requests" }
    post:
      tags: [Care Requests]
      operationId: createCareRequest
      summary: Create a care request
      description: |-
        Creates a care request for the caller (Patient) or for a dependent of the
        caller's account (Sponsor). Returns immediately; finding a provider starts
        on the server as part of the save.

        Requires an ID token with `contactId` and `accountId` claims and role
        **Sponsor** or **Patient**; Doctor and Nurse get `403`.

        **Idempotency-Key (required).** Generate **one fresh random key (for example a UUID v4) per submit attempt**: when the user taps *Request care* create the key, keep it for that attempt, and **reuse the same key only to retry that same attempt** (timeout, dropped connection, app restart before an answer). Never reuse a key for a different request, and never derive it from the symptoms or location. Same key + same caller + same patient returns the original request with `200` (no second request, same confirmation code); a `201` means it was created just now. The same key used for a different patient or by someone who could not see that request gets `409 IDEMPOTENCY_KEY_CONFLICT` and no request details. 8-100 characters: letters, digits, `_` and `-`.

        **Location must be the patient's, never the sponsor's device.** When a Sponsor requests care for a dependent, send the *dependent's* coordinates (where the visit will happen), not the sponsor's phone location; providers are sent to these coordinates. `latitude` and `longitude` are both required. Coordinates outside the service area (a generous box around Liberia) are rejected with `422 OUTSIDE_SERVICE_AREA`; this catches swapped latitude/longitude, `0,0` and positions from another country.

        **Rules.** One open request per patient: a patient with a request in Submitted, Dispatched, Provider Accepted, Provider Arrived/ In Progress or Escalated gets `409 OPEN_REQUEST_EXISTS` with `existingRequestId` (open that request instead of creating another). A Patient can only request for themselves (`patientContactId`, if sent, must be their own, else `403`). A Sponsor can request for themselves or for a dependent on their own account; any other id, including one from another account, returns the identical `404 PATIENT_NOT_FOUND`. The subscription is chosen by the server (same rule as the eligibility check); the client never sends one. `status`, `confirmationCode`, account and provider fields in the body are ignored.

        **Reading the answer.** `status` and `dispatchState` describe what happened right after creation: `PENDING_DISPATCH` (`status` = Submitted) means the request is saved and we are still finding a provider; `DISPATCHED` (`status` = Dispatched) means a provider has been notified. Neither means a provider has *accepted*. Both are normal `201` outcomes: show "request received" and the `confirmationCode`, then follow progress with the request-detail call. `dispatchState` is `null` on a replay once the request has moved on. Do not treat `PENDING_DISPATCH` as an error.

        **Retries.** On a network error, `502` or a `5xx` without a request id,
        retry with the **same** `Idempotency-Key`. On `500 UNEXPECTED_STATE` the
        request was created: use the returned `id` and do not retry with a new key.

        `NOT_ELIGIBLE` carries a `reasonCode`, one of `NO_SUBSCRIPTION`,
        `SUBSCRIPTION_PENDING`, `SUBSCRIPTION_SUSPENDED`, `SUBSCRIPTION_EXPIRED`,
        `SUBSCRIPTION_CANCELLED`, `VISITS_EXHAUSTED`, `SUBSCRIPTION_INACTIVE` or
        `BLOCKED_BY_RULE` (same codes as the eligibility check plus a rare
        save-time refusal). Codes only; the app owns the wording.
      security:
        - bearerAuth: []
      parameters:
        - name: Idempotency-Key
          in: header
          required: true
          description: One fresh random key per submit attempt; reuse only to retry that same attempt.
          schema:
            type: string
            minLength: 8
            maxLength: 100
            pattern: "^[A-Za-z0-9_-]{8,100}$"
          example: 3f2b9c1e-7d54-4a6b-9a10-0c1d2e3f4a5b
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateCareRequestBody"
            examples:
              forDependent:
                summary: Sponsor requesting for a dependent
                value: { patientContactId: "003XX00001QMgFvYAL", symptoms: "Fever and headache since yesterday", landmark: "Near the Waterside market", latitude: 6.3005, longitude: -10.7969 }
              forSelf:
                summary: Patient requesting for themselves
                value: { symptoms: "Persistent cough", latitude: 6.3005, longitude: -10.7969 }
      responses:
        "201":
          description: The request was created just now.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CareRequestCreated"
              examples:
                findingProvider:
                  value: { id: "a0dXX000001AbCdYAK", status: "Submitted", confirmationCode: "K7Q2ZM", createdAt: "2026-09-30T08:15:00.000Z", dispatchState: "PENDING_DISPATCH" }
                providerNotified:
                  value: { id: "a0dXX000001AbCdYAK", status: "Dispatched", confirmationCode: "K7Q2ZM", createdAt: "2026-09-30T08:15:00.000Z", dispatchState: "DISPATCHED" }
        "200":
          description: Replay of the same Idempotency-Key. The original request is returned; nothing new was created.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CareRequestCreated"
              example: { id: "a0dXX000001AbCdYAK", status: "Dispatched", confirmationCode: "K7Q2ZM", createdAt: "2026-09-30T08:15:00.000Z", dispatchState: "DISPATCHED" }
        "400":
          description: Missing or invalid Idempotency-Key, body, or field.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CareRequestError"
              examples:
                missingKey:
                  value: { error: "Idempotency-Key header is required", code: "INVALID_REQUEST" }
                missingSymptoms:
                  value: { error: "symptoms is required (up to 2000 characters)", code: "INVALID_REQUEST" }
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          description: Registration incomplete, not a Sponsor or Patient, or a Patient asking for someone else.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              examples:
                registrationIncomplete:
                  value: { error: "Registration incomplete" }
                wrongRole:
                  value: { error: "This action requires the Sponsor or Patient role" }
                notYou:
                  value: { error: "Not allowed" }
        "404":
          description: The patient does not exist or is not on the caller's account (the two cases are indistinguishable).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CareRequestError"
              example: { error: "Patient not found", code: "PATIENT_NOT_FOUND" }
        "409":
          description: Open request already exists, not eligible, or the Idempotency-Key belongs to a different request.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CareRequestError"
              examples:
                openRequest:
                  value: { error: "Patient already has an open care request", code: "OPEN_REQUEST_EXISTS", existingRequestId: "a0dXX000001AbCdYAK" }
                notEligible:
                  value: { error: "Care request not allowed", code: "NOT_ELIGIBLE", reasonCode: "VISITS_EXHAUSTED" }
                keyConflict:
                  value: { error: "Idempotency-Key was already used for a different request", code: "IDEMPOTENCY_KEY_CONFLICT" }
        "422":
          description: The location is outside the service area.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CareRequestError"
              example: { error: "Location is outside the service area", code: "OUTSIDE_SERVICE_AREA" }
        "500":
          description: Internal error, or the request was created but is in an unexpected state (`UNEXPECTED_STATE`, with the request `id`).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CareRequestError"
              examples:
                internal:
                  value: { error: "Internal error" }
                unexpectedState:
                  value: { error: "Care request was created in an unexpected state", code: "UNEXPECTED_STATE", id: "a0dXX000001AbCdYAK", status: "Escalated" }
        "502":
          description: Salesforce returned an unexpected error. The upstream body is not forwarded. Retry with the same Idempotency-Key.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example: { error: "Failed to create care request" }

  /care-requests/eligibility:
    get:
      tags: [Care Requests]
      operationId: checkCareRequestEligibility
      summary: Advisory pre-check for creating a care request
      description: >-
        **Advisory, read-only.** Tells the app whether a care request would be
        allowed for the caller's account right now. **Enforcement is not
        here**: it stays in the care-request creation rules on the
        server, which decide at create time.
        `eligible: true` is not a guarantee (visits are deducted when a visit
        starts, so several open requests can pass against the same last visit,
        and state can change before the create).

        Requires an ID token with `contactId` and `accountId` claims and role
        **Sponsor** or **Patient**; Doctor and Nurse get `403`.

        `reasonCode` is null when eligible and otherwise one of
        `NO_SUBSCRIPTION`, `SUBSCRIPTION_PENDING`, `SUBSCRIPTION_SUSPENDED`,
        `SUBSCRIPTION_EXPIRED`, `SUBSCRIPTION_CANCELLED`, `VISITS_EXHAUSTED`,
        `SUBSCRIPTION_INACTIVE`. Codes only; the app owns the wording. **Never
        branch on `subscriptionStatus`** (raw Salesforce value such as
        `Paused/ Suspended`); use `reasonCode`. An Active subscription with no
        visit allowance set returns `VISITS_EXHAUSTED`.

        The evaluated subscription is the account's newest Active one that still
        has visits, else its newest Active one, else its newest of any status.
      security:
        - bearerAuth: []
      responses:
        "200":
          description: The advisory result.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CareRequestEligibility"
              examples:
                eligible:
                  value: { eligible: true, reasonCode: null, visitsRemaining: 9, subscriptionStatus: "Active" }
                visitsExhausted:
                  value: { eligible: false, reasonCode: "VISITS_EXHAUSTED", visitsRemaining: 0, subscriptionStatus: "Active" }
                pending:
                  value: { eligible: false, reasonCode: "SUBSCRIPTION_PENDING", visitsRemaining: 0, subscriptionStatus: "Pending" }
                noSubscription:
                  value: { eligible: false, reasonCode: "NO_SUBSCRIPTION", visitsRemaining: null, subscriptionStatus: null }
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          description: Token is missing `contactId`/`accountId` claims, or the caller is not a Sponsor or Patient.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              examples:
                registrationIncomplete:
                  value: { error: "Registration incomplete" }
                wrongRole:
                  value: { error: "This action requires the Sponsor or Patient role" }
        "500":
          $ref: "#/components/responses/InternalError"
        "502":
          description: Salesforce returned an unexpected error. The upstream body is not forwarded.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example: { error: "Failed to fetch eligibility" }

  /care-requests/{id}:
    get:
      tags: [Care Requests]
      operationId: getCareRequest
      summary: Get one care request
      description: |-
        A **Sponsor** sees the requests of their account; a **Patient** sees only their own. Doctor and Nurse tokens get 403. A request that does not exist, is not yours, or has a malformed id returns the identical 404.

        **confirmationCode is shown only while the request is Submitted, Dispatched or Provider Accepted**; in every other status (Provider Arrived/ In Progress, Complete, Escalated, Cancelled) it is `null`. Handle `null` and do not cache the code.

        **provider** is `{ name, type, rating }` once someone is assigned, otherwise `null`. It never includes a phone number or location. Treat `null` as "no provider yet".

        `/care-requests/eligibility` is a separate fixed path and is never treated as an id.
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
          example: "a2vXX000001AbCdYAK"
      responses:
        "200":
          description: The request.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CareRequestDetail"
              examples:
                dispatched:
                  value: { id: "a2vXX000001AbCdYAK", status: "Dispatched", createdAt: "2026-09-30T08:15:00.000Z", symptoms: "Fever and headache since yesterday", landmark: "Near the Waterside market", patient: { id: "003XX00001PhybaYAB", name: "Anthony Doe" }, provider: { name: "Dora Doc", type: "Doctor", rating: 4.5 }, confirmationCode: "K7Q2ZM" }
                complete:
                  value: { id: "a2vXX000001AbCdYAK", status: "Complete", createdAt: "2026-09-30T08:15:00.000Z", symptoms: "Fever and headache since yesterday", landmark: null, patient: { id: "003XX00001PhybaYAB", name: "Anthony Doe" }, provider: { name: "Dora Doc", type: "Doctor", rating: 4.5 }, confirmationCode: null }
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          description: Registration incomplete, or not a Sponsor or Patient.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example: { error: "This action requires the Sponsor or Patient role" }
        "404":
          description: Not found, not yours, or a malformed id (identical response).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example: { error: "Care request not found" }
        "500":
          $ref: "#/components/responses/InternalError"
        "502":
          description: Salesforce returned an unexpected error. The upstream body is not forwarded.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example: { error: "Failed to fetch care request" }

  /dependents:
    get:
      tags: [Dependents]
      operationId: listDependents
      summary: List the dependents on the caller's Sponsor account
      description: >-
        Returns the dependents (members of the account with the Patient role) on the
        calling Sponsor's account, sorted by last name then first name. The caller is
        never included. Read-only. Maximum 200 items, no pagination.

        **Sponsor role only** (any other role gets `403`). Requires an ID token
        carrying `contactId`/`accountId` claims.

        `claimed` is true when the dependent has signed in and linked their own
        login; no login identifier is ever returned. People with no role set on
        the account do not appear. `birthdate` and
        `phone` are deliberately not returned and can be added if the screen
        needs them.
      security:
        - bearerAuth: []
      responses:
        "200":
          description: The dependent list (`items` is empty when there are none).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DependentList"
              examples:
                populated:
                  value:
                    items:
                      - { id: "003XX000004EXMPL01", firstName: "Alex", lastName: "Sample", claimed: false, appAccountCreated: false }
                      - { id: "003XX000004EXMPL02", firstName: "Sam", lastName: "Sample", claimed: true, appAccountCreated: true }
                empty:
                  value: { items: [] }
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          description: Token is missing `contactId`/`accountId` claims, or the caller is not a Sponsor.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              examples:
                registrationIncomplete:
                  value: { error: "Registration incomplete" }
                notSponsor:
                  value: { error: "This action requires the Sponsor role" }
        "500":
          $ref: "#/components/responses/InternalError"
        "502":
          description: Salesforce returned an unexpected error. The upstream body is not forwarded.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example: { error: "Failed to fetch dependents" }

  /dependent/register:
    post:
      tags: [Dependents]
      operationId: registerDependent
      summary: Register a dependent under the caller's Sponsor account
      description: >-
        Registers a new dependent Contact under the CALLING Sponsor's Salesforce
        Account. `firstName`, `dateOfBirth`, and `phone` are required. Use a phone
        number DIFFERENT from the sponsor's own — that number is how the dependent
        will later claim this profile themselves via `POST /dependent/claim`.

        Requires an ID token belonging to a Sponsor who has already completed
        `POST /register` (i.e. whose token carries the `contactId`/`accountId`/
        `role` claims described in `CallerIdentity`) — a token missing those claims
        gets `403 Registration incomplete`.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [firstName, dateOfBirth, phone]
              properties:
                firstName: { type: string, example: "Anthony" }
                lastName: { type: string, example: "Doe" }
                dateOfBirth:
                  type: string
                  format: date
                  example: "2015-04-12"
                phone:
                  type: string
                  description: >-
                    Must be different from the sponsor's own phone number — this
                    is the number the dependent will use to claim this profile.
                  example: "+231770000002"
                email: { type: string, format: email, example: "anthony.dependent@example.com" }
            example:
              firstName: "Anthony"
              lastName: "Doe"
              dateOfBirth: "2015-04-12"
              phone: "+231770000002"
              email: "anthony.dependent@example.com"
      responses:
        "200":
          description: Dependent registered.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DependentRecord"
        "400":
          description: A required field is missing.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                error: "firstName, dateOfBirth, and phone are all required"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          description: >-
            The caller's token is missing `contactId`/`accountId` claims (see
            `CallerIdentity`), or Salesforce rejected the call for the caller's role.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              examples:
                registrationIncomplete:
                  value: { error: "Registration incomplete" }
                sfForbidden:
                  value: { error: "Failed to register dependent", detail: "Forbidden for this role" }
        "409":
          description: A dependent already exists for that phone number under this Account.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorWithDetail"
              example:
                error: "Failed to register dependent"
                detail: "DUPLICATE_DEPENDENT_PHONE"
        "500":
          $ref: "#/components/responses/InternalError"
        "502":
          description: The Salesforce Apex REST call returned an unexpected non-2xx response.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorWithDetail"
              example:
                error: "Failed to register dependent"
                detail: "INTERNAL_SERVER_ERROR"

  /dependent/claim:
    post:
      tags: [Dependents]
      operationId: claimDependent
      summary: Claim a pre-registered dependent profile as its own Firebase identity
      description: >-
        ⚠️ SEPARATE IDENTITY FROM THE SPONSOR. Before calling this, the dependent
        must sign in as THEMSELVES: `POST /otp/request` → `POST /otp/verify` → the
        client-side custom-token-for-ID-token exchange, using the phone number the
        sponsor registered them with in `POST /dependent/register` — NOT the
        sponsor's phone. The resulting ID token, for the dependent's OWN Firebase
        account, is what must be presented as the Bearer token here; the sponsor's
        ID token will not work (it has no matching unclaimed dependent record for
        its own phone number).

        On success, this looks up a Salesforce dependent record matching the
        verified phone number on the token, links it to this Firebase uid, stores
        the given `password` as this account's credential, and attaches
        `contactId`/`accountId`/`role` custom claims (see `CallerIdentity`) — after
        this, the dependent can `POST /login` with their own phone + password just
        like a Sponsor.

        Requires a verified `phone_number` claim on the token (i.e. a completed OTP
        verification for the dependent's own number) and a matching, not-yet-claimed
        dependent record already created via `POST /dependent/register`.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [password]
              properties:
                password:
                  type: string
                  minLength: 8
                  example: "DependentPass456!"
            example:
              password: "DependentPass456!"
      responses:
        "200":
          description: Dependent record claimed and linked to this Firebase account.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RegistrationResult"
              example:
                contactId: "003XX000004TmiRQAS"
                accountId: "001XX000003DHPhQAO"
                role: "Dependent"
                wasExisting: true
        "400":
          description: Password missing/too short, or the token has no verified phone number.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              examples:
                noPhone:
                  value: { error: "No verified phone number on this account" }
                badPassword:
                  value: { error: "password is required and must be at least 8 characters" }
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          description: >-
            No unclaimed dependent record exists in Salesforce for this phone
            number — run `POST /dependent/register` (as the sponsor) first.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorWithDetail"
              example:
                error: "Claim failed"
                detail: "NOT_FOUND"
        "500":
          description: >-
            Could not reach Salesforce at all, or the claim succeeded on the
            Salesforce side but the local password write failed.
          content:
            application/json:
              schema:
                anyOf:
                  - $ref: "#/components/schemas/Error"
                  - $ref: "#/components/schemas/PartialSuccessError"
              examples:
                sfError:
                  summary: Could not reach Salesforce at all
                  value: { error: "Internal error contacting Salesforce" }
                passwordWriteFailed:
                  summary: Salesforce link succeeded but the password could not be stored
                  value:
                    error: "Profile linked but password could not be set — please try again"
                    contactId: "003XX000004TmiRQAS"
        "502":
          description: The Salesforce Apex REST call returned an unexpected non-2xx, non-404 response.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorWithDetail"
              example:
                error: "Claim failed"
                detail: "INTERNAL_SERVER_ERROR"

  /provider/me:
    get:
      tags: [Providers]
      operationId: getMyProviderProfile
      summary: The calling Doctor's or Nurse's own profile summary
      description: >-
        The caller's own provider profile summary. Read-only. Requires a
        **provider** ID token (role `Doctor` or `Nurse`). Provider tokens carry
        `contactId`, `careTeamMemberId` and `role` and no `accountId`; none is
        needed. Sponsor and Patient tokens get `403`.

        Returns `200` for every `vettingStatus`; the app must gate on it.
        `Pending` = awaiting admin approval ("account under review");
        `Vetted` = approved (only these are dispatched to); `Suspended` =
        admin-set, nothing automatic sets it ("account suspended"); anything
        else or null = neutral blocked screen.

        `rating`, `totalCompletedVisits`, `totalDispatches` and
        `averageResponseTimeMins` are **null today** (nothing populates them
        yet); treat null as "no data", not 0. `availabilityStatus` is null if
        never set. The payout account and licence number are deliberately not
        returned.
      security:
        - bearerAuth: []
      responses:
        "200":
          description: The provider profile.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProviderProfile"
              examples:
                vetted:
                  value: { providerType: "Doctor", specialisation: "Pro", vettingStatus: "Vetted", onDuty: false, availabilityStatus: null, rating: null, totalCompletedVisits: null, totalDispatches: null, averageResponseTimeMins: null }
                pending:
                  value: { providerType: "Nurse", specialisation: "Midwifery", vettingStatus: "Pending", onDuty: false, availabilityStatus: null, rating: null, totalCompletedVisits: null, totalDispatches: null, averageResponseTimeMins: null }
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          description: Token is missing `contactId`, or the caller is not a Doctor or Nurse.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              examples:
                notProvider:
                  value: { error: "This action requires the Doctor or Nurse role" }
                registrationIncomplete:
                  value: { error: "Registration incomplete" }
        "404":
          description: No provider profile exists for this login.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example: { error: "Provider profile not found" }
        "500":
          $ref: "#/components/responses/InternalError"
        "502":
          description: Salesforce returned an unexpected error. The upstream body is not forwarded.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example: { error: "Failed to fetch provider profile" }

  /provider/availability:
    put:
      tags: [Providers]
      operationId: setMyAvailability
      summary: Go on or off duty, or mark yourself Busy
      description: |-
        Sets the calling Doctor's or Nurse's own duty and availability. Requires a **provider** ID token (role `Doctor` or `Nurse`; no `accountId` needed). Sponsor and Patient tokens get `403`.

        The provider must currently be **Vetted**. This is checked on the server on every call, so a provider whose account was set to `Pending` or `Suspended` after signing in gets `403` with code `NOT_VETTED` even though the token is still valid. Use `GET /provider/me` to decide which screen to show.

        Send `onDuty` (required) and, optionally, `availabilityStatus`:

        - `onDuty: false` always results in `Off Duty`.
        - `onDuty: true` with no status results in `Available`.
        - `onDuty: true` with `Busy` keeps you on duty but marks you busy.
        - `onDuty: true` with `Off Duty` is rejected with `422 STATUS_CONFLICT`.

        Any other field in the body is rejected with `400`; nothing is saved. The answer shows the values that were saved. How these values influence which provider is offered a visit is decided by the dispatch service and may change.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProviderAvailabilityRequest"
            examples:
              goOnDuty:
                value: { onDuty: true }
              busy:
                value: { onDuty: true, availabilityStatus: "Busy" }
              goOffDuty:
                value: { onDuty: false }
      responses:
        "200":
          description: The values that were saved.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProviderAvailability"
              examples:
                available:
                  value: { onDuty: true, availabilityStatus: "Available" }
                offDuty:
                  value: { onDuty: false, availabilityStatus: "Off Duty" }
        "400":
          description: The body is not valid (missing or non-boolean `onDuty`, unknown status, or any other field).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProviderWriteError"
              example: { error: "onDuty is required and must be true or false", code: "INVALID_REQUEST" }
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          description: Not a Doctor or Nurse, the token is missing `contactId`, or the provider is not Vetted (`NOT_VETTED`).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProviderWriteError"
              examples:
                notProvider:
                  value: { error: "This action requires the Doctor or Nurse role" }
                registrationIncomplete:
                  value: { error: "Registration incomplete" }
                notVetted:
                  value: { error: "Provider not vetted", code: "NOT_VETTED" }
        "404":
          description: No provider profile exists for this login.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProviderWriteError"
              example: { error: "Provider profile not found" }
        "422":
          description: "`onDuty: true` cannot be combined with `Off Duty`."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProviderWriteError"
              example: { error: "Off Duty cannot be set while on duty", code: "STATUS_CONFLICT" }
        "500":
          $ref: "#/components/responses/InternalError"
        "502":
          description: The server could not confirm or save the change. Nothing from the upstream answer is forwarded; retry later.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProviderWriteError"
              examples:
                saveFailed:
                  value: { error: "Failed to update availability" }
                cannotVerify:
                  value: { error: "Could not verify provider status" }

  /provider/location:
    put:
      tags: [Providers]
      operationId: setMyLocation
      summary: Report your current position
      description: |-
        Reports the calling Doctor's or Nurse's own current position. Requires a **provider** ID token (role `Doctor` or `Nurse`; no `accountId` needed). Sponsor and Patient tokens get `403`.

        The provider must currently be **Vetted**; this is checked on the server on every call (`403` with code `NOT_VETTED` otherwise), exactly as for `PUT /provider/availability`.

        Send `latitude` and `longitude` as plain numbers (decimal degrees) and nothing else; any other field is rejected with `400` and nothing is saved. Exactly `0,0` is a placeholder, not a position, and is rejected with `422 INVALID_LOCATION`.

        **Rate limit:** at most one accepted update every **5 seconds** per provider. A faster call gets `429 RATE_LIMITED` with a `Retry-After: 5` header and is not saved; send the next update after the delay. The answer only contains `updatedAt` (UTC); the coordinates are not echoed back.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProviderLocationRequest"
            example: { latitude: 6.3005, longitude: -10.7969 }
      responses:
        "200":
          description: The position was saved.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProviderLocationUpdated"
              example: { updatedAt: "2026-10-02T20:18:44.123Z" }
        "400":
          description: The body is not valid (missing or non-numeric coordinates, out of range, or any other field).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProviderWriteError"
              example: { error: "latitude is out of range", code: "INVALID_REQUEST" }
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          description: Not a Doctor or Nurse, the token is missing `contactId`, or the provider is not Vetted (`NOT_VETTED`).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProviderWriteError"
              examples:
                notProvider:
                  value: { error: "This action requires the Doctor or Nurse role" }
                notVetted:
                  value: { error: "Provider not vetted", code: "NOT_VETTED" }
        "404":
          description: No provider profile exists for this login.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProviderWriteError"
              example: { error: "Provider profile not found" }
        "422":
          description: The position is the `0,0` placeholder.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProviderWriteError"
              example: { error: "Location is not a real position", code: "INVALID_LOCATION" }
        "429":
          description: Too many updates; at most one every 5 seconds. Nothing was saved.
          headers:
            Retry-After:
              description: Seconds to wait before the next update.
              schema: { type: integer, example: 5 }
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProviderWriteError"
              example: { error: "Too many location updates", code: "RATE_LIMITED" }
        "500":
          $ref: "#/components/responses/InternalError"
        "502":
          description: The server could not confirm or save the change. Nothing from the upstream answer is forwarded; retry later.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProviderWriteError"
              examples:
                saveFailed:
                  value: { error: "Failed to update location" }
                cannotVerify:
                  value: { error: "Could not verify provider status" }

  /provider/dispatches:
    get:
      tags: [Providers]
      operationId: listMyDispatches
      summary: The calling Doctor's or Nurse's own active dispatches
      description: |-
        The caller's own Pending or Accepted dispatches, for requests still `Dispatched`, `Provider Accepted` or `Provider Arrived/ In Progress`. Requires a **provider** ID token (role `Doctor` or `Nurse`; no `accountId` needed). The provider must currently be **Vetted** (`403 NOT_VETTED` otherwise), exactly as for `PUT /provider/availability`.

        **Pending** rows show `landmark`, `symptoms`, `distanceKm` and `secondsLeft` on the 7-minute acceptance window (`secondsLeft` is `null` once it would go negative, floored at 0, and also `null` if the window has no start time yet); `phone`, `latitude` and `longitude` are `null`.

        **Accepted** rows show `phone` and the patient's exact `latitude`/`longitude` instead; `distanceKm` and `secondsLeft` are `null`.

        A confirmation code is never included on any row, Pending or Accepted.
      security:
        - bearerAuth: []
      responses:
        "200":
          description: The caller's active dispatches.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DispatchList"
              examples:
                mixed:
                  value:
                    items:
                      - id: "a2xXX000001ExMPLAZ"
                        careRequestId: "a2vXX000001AbCdYAK"
                        status: "Pending"
                        landmark: "Blue gate, third house"
                        symptoms: "Fever and chills"
                        distanceKm: 1.8
                        secondsLeft: 340
                        phone: null
                        latitude: null
                        longitude: null
                      - id: "a2xXX000001ExMPLBZ"
                        careRequestId: "a2vXX000001AbCdYAL"
                        status: "Accepted"
                        landmark: "Near the market"
                        symptoms: "Chest pain"
                        distanceKm: null
                        secondsLeft: null
                        phone: "0770000002"
                        latitude: 6.31
                        longitude: -10.79
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          description: Not a Doctor or Nurse, the token is missing `contactId`, or the provider is not Vetted (`NOT_VETTED`).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProviderWriteError"
              examples:
                notProvider:
                  value: { error: "This action requires the Doctor or Nurse role" }
                notVetted:
                  value: { error: "Provider not vetted", code: "NOT_VETTED" }
        "500":
          $ref: "#/components/responses/InternalError"
        "502":
          description: The server could not fetch the list, or could not confirm the provider's status. Nothing from the upstream answer is forwarded; retry later.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProviderWriteError"
              examples:
                fetchFailed:
                  value: { error: "Failed to fetch dispatches" }
                cannotVerify:
                  value: { error: "Could not verify provider status" }

  /provider/dispatches/{id}/accept:
    post:
      tags: [Providers]
      operationId: acceptDispatch
      summary: Accept your own Pending dispatch
      description: |-
        Accepts one of the caller's own dispatches. Requires a **provider** ID token (role `Doctor` or `Nurse`). The provider must currently be **Vetted** (`403 NOT_VETTED` otherwise). Takes **no request body** at all; any body is rejected with `400`.

        A dispatch that does not exist, is not yours, or has a malformed id all return the identical `404`. Accepting it requires the dispatch to still be Pending, the newest dispatch for its request, and the request still `Dispatched`; any other combination returns one fixed `409 NOT_ACCEPTABLE` (the response never says which of the three failed). Accepting any time before the 7-minute fallback window expires is the normal path, not a race.
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          description: Dispatch id from `GET /provider/dispatches` (15 or 18 letters/digits).
          schema: { type: string, pattern: "^([A-Za-z0-9]{15}|[A-Za-z0-9]{18})$" }
          example: a2xXX000001ExMPLAZ
      responses:
        "200":
          description: Accepted.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DispatchActionResult"
              example: { status: "Accepted" }
        "400":
          description: A request body was sent; this action takes none.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProviderWriteError"
              example: { error: "This action takes no request body", code: "INVALID_REQUEST" }
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          description: Not a Doctor or Nurse, the token is missing `contactId`, or the provider is not Vetted (`NOT_VETTED`).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProviderWriteError"
              examples:
                notProvider:
                  value: { error: "This action requires the Doctor or Nurse role" }
                notVetted:
                  value: { error: "Provider not vetted", code: "NOT_VETTED" }
        "404":
          description: Not found, not yours, or a malformed id (identical response).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProviderWriteError"
              example: { error: "Dispatch not found" }
        "409":
          description: Not Pending, not the newest dispatch for its request, or the request is no longer Dispatched (identical response for all three).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProviderWriteError"
              example: { error: "This dispatch can no longer be accepted", code: "NOT_ACCEPTABLE" }
        "500":
          $ref: "#/components/responses/InternalError"
        "502":
          description: The server could not confirm or save the change. Nothing from the upstream answer is forwarded; retry later.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProviderWriteError"
              examples:
                saveFailed:
                  value: { error: "Failed to accept dispatch" }
                cannotVerify:
                  value: { error: "Could not verify provider status" }

  /provider/dispatches/{id}/reject:
    post:
      tags: [Providers]
      operationId: rejectDispatch
      summary: Reject your own Pending dispatch
      description: |-
        Rejects one of the caller's own dispatches. Requires a **provider** ID token (role `Doctor` or `Nurse`). The provider must currently be **Vetted** (`403 NOT_VETTED` otherwise). Takes **no request body** at all; any body is rejected with `400`.

        A dispatch that does not exist, is not yours, or has a malformed id all return the identical `404`. The same eligibility rule as `accept` applies (Pending, newest for its request, request still `Dispatched`); anything else returns one fixed `409 NOT_REJECTABLE` — including rejecting a dispatch that was already Accepted.

        On success, a same-type replacement provider is found and dispatched automatically when one is available; if not (attempt cap reached, or no alternate provider found), the request is left `Dispatched` with no assigned provider rather than failing the reject itself. Either way the caller only sees `{ "status": "Declined" }` — the reassignment outcome is not reported back to the rejecting provider.
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          description: Dispatch id from `GET /provider/dispatches` (15 or 18 letters/digits).
          schema: { type: string, pattern: "^([A-Za-z0-9]{15}|[A-Za-z0-9]{18})$" }
          example: a2xXX000001ExMPLAZ
      responses:
        "200":
          description: Declined.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DispatchActionResult"
              example: { status: "Declined" }
        "400":
          description: A request body was sent; this action takes none.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProviderWriteError"
              example: { error: "This action takes no request body", code: "INVALID_REQUEST" }
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          description: Not a Doctor or Nurse, the token is missing `contactId`, or the provider is not Vetted (`NOT_VETTED`).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProviderWriteError"
              examples:
                notProvider:
                  value: { error: "This action requires the Doctor or Nurse role" }
                notVetted:
                  value: { error: "Provider not vetted", code: "NOT_VETTED" }
        "404":
          description: Not found, not yours, or a malformed id (identical response).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProviderWriteError"
              example: { error: "Dispatch not found" }
        "409":
          description: Not Pending (including an already-Accepted dispatch), not the newest dispatch for its request, or the request is no longer Dispatched (identical response for all).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProviderWriteError"
              example: { error: "This dispatch can no longer be rejected", code: "NOT_REJECTABLE" }
        "500":
          $ref: "#/components/responses/InternalError"
        "502":
          description: The server could not confirm or save the change. Nothing from the upstream answer is forwarded; retry later.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProviderWriteError"
              examples:
                saveFailed:
                  value: { error: "Failed to reject dispatch" }
                cannotVerify:
                  value: { error: "Could not verify provider status" }

  /provider/claim:
    post:
      tags: [Providers]
      operationId: claimProvider
      summary: Claim a pre-vetted provider (Doctor/Nurse) profile as its own Firebase identity
      description: >-
        ⚠️ SEPARATE IDENTITY, and unlike dependents there is no self-serve
        registration endpoint for providers in this API. A Doctor or Nurse's
        profile must already exist — created directly by an administrator, not
        via any endpoint here — and must be vetted before this call can
        succeed.

        Before calling this, the provider must sign in as THEMSELVES:
        `POST /otp/request` → `POST /otp/verify` → the client-side
        custom-token-for-ID-token exchange, using their own phone number (the
        one their pre-created Contact record has on file). The resulting ID
        token is what must be presented as the Bearer token here.

        On success, this links the verified Firebase uid to the matching
        Salesforce Contact, sets the given `password` as this account's
        credential, and attaches `contactId`, `careTeamMemberId`, and `role`
        (`"Doctor"` or `"Nurse"`) as Firebase custom claims — after this, the
        provider can `POST /login` with their phone + password like anyone
        else. Calling this again for an already-claimed provider is idempotent:
        it returns `200` with `wasExisting: true` and the same identifiers,
        rather than an error.

        ⚠️ **No `accountId` claim is ever set for providers** (providers have no
        Account relationship). `GET /me` and `GET /medical-record` are
        `contactId`-only and work fine for a claimed provider; the
        Account-scoped endpoints — `GET /subscription/status`,
        `GET /wallet/balance`, `POST /wallet/topup` — still require
        `accountId` too and will correctly reject a provider's token with
        `403 Registration incomplete`, since none of those concepts apply to a
        provider anyway.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [password]
              properties:
                password:
                  type: string
                  minLength: 8
                  example: "ProviderPass456!"
            example:
              password: "ProviderPass456!"
      responses:
        "200":
          description: >-
            Provider record claimed and linked to this Firebase account (or
            already claimed previously — see `wasExisting`).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProviderClaimResult"
              examples:
                firstClaim:
                  summary: First-time claim
                  value:
                    contactId: "003XX000004TmiSQAS"
                    careTeamMemberId: "a0CXX000004TmiSQAS"
                    role: "Doctor"
                    wasExisting: false
                alreadyClaimed:
                  summary: Re-claim of an already-linked provider (idempotent)
                  value:
                    contactId: "003XX000004TmiSQAS"
                    careTeamMemberId: "a0CXX000004TmiSQAS"
                    role: "Doctor"
                    wasExisting: true
        "400":
          description: Password missing/too short, or the token has no verified phone number.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              examples:
                noPhone:
                  value: { error: "No verified phone number on this account" }
                badPassword:
                  value: { error: "password is required and must be at least 8 characters" }
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          description: >-
            A matching provider record was found for this phone number, but it
            isn't vetted yet —
            passthrough from Salesforce.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorWithDetail"
              example:
                error: "Claim failed"
                detail: "{\"error\":\"Your registration is still under review. You will be notified once your account is approved.\"}"
        "404":
          description: >-
            No unclaimed provider record exists in Salesforce for this phone
            number — an administrator needs to create it directly in Salesforce
            first; there is no API endpoint for that step.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorWithDetail"
              example:
                error: "Claim failed"
                detail: "{\"error\":\"No provider registration found for this phone number. Contact your administrator if you believe this is an error.\"}"
        "500":
          description: >-
            Could not reach Salesforce at all, or the claim succeeded on the
            Salesforce side but the local password write failed.
          content:
            application/json:
              schema:
                anyOf:
                  - $ref: "#/components/schemas/Error"
                  - $ref: "#/components/schemas/PartialSuccessError"
              examples:
                sfError:
                  summary: Could not reach Salesforce at all
                  value: { error: "Internal error contacting Salesforce" }
                passwordWriteFailed:
                  summary: Salesforce link succeeded but the password could not be stored
                  value:
                    error: "Profile linked but password could not be set — please try again"
                    contactId: "003XX000004TmiSQAS"
        "502":
          description: >-
            The Salesforce Apex REST call returned an unexpected non-2xx,
            non-403, non-404 response — e.g. the provider's Contact record
            exists but has no associated provider profile (a data-integrity
            gap surfaced by Salesforce as a 500, collapsed here to 502).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorWithDetail"
              example:
                error: "Claim failed"
                detail: "{\"error\":\"Provider record is incomplete. Please contact support.\"}"

  /me:
    get:
      tags: [My Profile]
      operationId: getMyProfile
      summary: Get the caller's own profile
      description: >-
        Returns the caller's own Salesforce profile (Contact/Account details) —
        works for Sponsor, Dependent (Patient), and Doctor/Nurse (provider)
        roles alike, whichever identity's ID token is presented.

        Requires an ID token carrying a `contactId` claim (see
        `CallerIdentity`) — deliberately NOT `accountId` too, since
        the profile lookup uses `contactId` alone and returns
        `accountId: null` gracefully for providers, who never have one. A
        completed `POST /register`, `POST /dependent/claim`, or
        `POST /provider/claim` all satisfy this.
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Profile found.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProfileRecord"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/RegistrationIncomplete"
        "404":
          description: No matching profile found in Salesforce for this caller.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorWithDetail"
              example:
                error: "Failed to fetch profile"
                detail: "NOT_FOUND"
        "500":
          $ref: "#/components/responses/InternalError"
        "502":
          description: The Salesforce Apex REST call returned an unexpected non-2xx, non-404 response.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorWithDetail"
              example:
                error: "Failed to fetch profile"
                detail: "INTERNAL_SERVER_ERROR"

  /device-token:
    post:
      tags: [Push Notifications]
      operationId: registerDeviceToken
      summary: Register or update this device's push token
      description: >-
        Registers/updates the FCM device token for the currently signed-in
        identity. Works for Sponsor, Dependent, and Provider alike: no
        `accountId` claim is required. Only one device token is stored per
        person, so registering a second device replaces the first.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [deviceToken]
              properties:
                deviceToken:
                  type: string
                  description: FCM registration token for this device.
                  example: "fcm-test-token-abc123xyz"
            example:
              deviceToken: "fcm-test-token-abc123xyz"
      responses:
        "200":
          description: >-
            Device token saved. Note the Cloud Function always returns this
            literal body on any Salesforce 2xx — it doesn't forward
            Salesforce's actual response.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessResponse"
              example:
                success: true
        "400":
          description: "`deviceToken` missing or not a string."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                error: "deviceToken is required"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          description: The token has no `contactId` claim yet.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                error: "Account not yet linked to a Contact — complete claim/login first"
        "404":
          description: >-
            Passthrough — no Contact found for this caller's `contactId`
            (shouldn't normally happen if it came from a real claim/register).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorWithDetail"
              example:
                error: "Could not register device"
                detail: "{\"error\":\"No Contact found for this caller\"}"
        "500":
          $ref: "#/components/responses/InternalError"
        "502":
          description: >-
            Any other server-side failure while saving the device token.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorWithDetail"
              example:
                error: "Could not register device"
                detail: "{\"error\":\"Failed to save device token: ... INSUFFICIENT_ACCESS_OR_READONLY ...\"}"

  /internal/send-push:
    post:
      x-internal: true
      tags: [Push Notifications]
      operationId: sendInternalPush
      summary: Send a push notification (internal, Salesforce-only)
      description: >-
        ⚠️ NOT part of the mobile API surface. Called server-to-server by
        Salesforce's `PushNotificationSender`, authenticated by a shared
        secret instead of any Firebase ID token — no `Authorization` header
        is used here at all.
      security:
        - internalSecret: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [deviceToken, title, body]
              properties:
                deviceToken:
                  type: string
                  example: "fcm-test-token-abc123xyz"
                title:
                  type: string
                  example: "Test Notification"
                body:
                  type: string
                  example: "This is a test push from the CareRoute API demo."
                data:
                  type: object
                  description: >-
                    Arbitrary key/value pairs forwarded to FCM. Every value is
                    coerced to a string server-side (FCM requires string-only
                    data payloads), so numbers/booleans are accepted without
                    the Apex caller needing to worry about it.
                  additionalProperties: true
                  example: { type: "test" }
            example:
              deviceToken: "fcm-test-token-abc123xyz"
              title: "Test Notification"
              body: "This is a test push from the CareRoute API demo."
              data: { type: "test" }
      responses:
        "200":
          description: Notification sent.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PushSendResult"
              example:
                success: true
                messageId: "projects/careroute-auth-app/messages/0:1234567890"
        "400":
          description: A required field is missing.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              examples:
                noDeviceToken:
                  value: { error: "deviceToken is required" }
                noTitleOrBody:
                  value: { error: "title and body are required" }
        "401":
          description: Missing or mismatched `x-internal-secret` header.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                error: "Unauthorized"
        "410":
          description: >-
            The device token is fake, expired, or the app was uninstalled —
            the caller (Salesforce) should clear its stored `Device_Token__c`
            rather than retry against a token that will never work again.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DeadDeviceTokenError"
              examples:
                invalidToken:
                  value: { error: "Device token is no longer valid", code: "messaging/invalid-registration-token" }
                unregisteredToken:
                  value: { error: "Device token is no longer valid", code: "messaging/registration-token-not-registered" }
        "500":
          description: Any other FCM error.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorWithDetail"
              example:
                error: "Failed to send push notification"
                detail: "Requested entity was not found."

  /subscription/status:
    get:
      tags: [Account Data (Tier 1)]
      operationId: getSubscriptionStatus
      summary: Get the caller's Account subscription status
      description: >-
        Returns the current subscription for the caller's account: `status`
        (`Active`, `Pending`, `Paused/ Suspended`, `Expired` or `Cancelled`),
        `planType`, `visitsRemaining` and `renewalDate`. A newly registered
        sponsor starts as `Pending` until the subscription is activated. To
        decide whether to offer "request care", use
        `GET /care-requests/eligibility`; do not branch on the raw `status`
        string.

        Requires an ID token carrying `contactId`/`accountId` claims (see
        `CallerIdentity`).
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Subscription status retrieved.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SubscriptionStatus"
              example:
                status: "Active"
                planType: "Sponsor ($150)"
                visitsRemaining: 4
                renewalDate: "2027-03-04"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/RegistrationIncomplete"
        "404":
          description: No subscription record found on the Account.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorWithDetail"
              example:
                error: "Failed to fetch subscription status"
                detail: "NOT_FOUND"
        "500":
          $ref: "#/components/responses/InternalError"
        "502":
          description: The Salesforce Apex REST call returned an unexpected non-2xx, non-404 response.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorWithDetail"
              example:
                error: "Failed to fetch subscription status"
                detail: "INTERNAL_SERVER_ERROR"

  /wallet/balance:
    get:
      tags: [Wallet]
      operationId: getWalletBalance
      summary: Get the caller's Account wallet balance
      description: >-
        Returns the wallet balance for the caller's Salesforce Account.

        **Known limitation:** this endpoint is Sponsor-role only — a Dependent
        (Patient)-role caller currently gets `403`, since dependents don't hold
        their own wallet.

        Requires an ID token carrying `contactId`/`accountId` claims (see
        `CallerIdentity`).
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Wallet balance retrieved.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WalletBalance"
              example:
                currentBalance: 25.5
                lowBalanceThreshold: 5
                walletStatus: "Active"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          description: >-
            The caller's token is missing `contactId`/`accountId` claims, OR the
            caller's role is not entitled to a wallet (i.e. not a Sponsor).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              examples:
                registrationIncomplete:
                  value: { error: "Registration incomplete" }
                notEntitled:
                  summary: Caller role (e.g. a claimed dependent) has no wallet
                  value: { error: "Failed to fetch wallet balance", detail: "FORBIDDEN" }
        "500":
          $ref: "#/components/responses/InternalError"
        "502":
          description: The Salesforce Apex REST call returned an unexpected non-2xx, non-403 response.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorWithDetail"
              example:
                error: "Failed to fetch wallet balance"
                detail: "INTERNAL_SERVER_ERROR"

  /wallet/transactions:
    get:
      tags: [Wallet]
      operationId: listWalletTransactions
      summary: List the account's wallet transactions (newest first, cursor-paginated)
      description: >-
        Wallet history for the calling Sponsor's account. Read-only.
        **Sponsor role only** (any other role gets `403`). Requires an ID token
        carrying `contactId`/`accountId` claims.

        Ordered by `createdAt` descending, ties broken by `id`. `nextCursor` is
        null on the last page. There is **no default filter**. `amount` and
        `reference` can be null. Currency and the Email field are never
        returned; `amount` is the amount stored at initiation.

        **Scope:** wallet ledger rows only, which today means top-ups. Renewal
        deductions and other payments (extra visits, renewals) are not included.
        Behaviour is account-level (an account with several wallets returns
        transactions from all of them). Rows created by other owners are not
        visible to this endpoint.

        **Status handling:** `Success` = paid; `Failed` = failed; `Pending`
        under 24 hours old (compute from `createdAt`) = processing; `Pending`
        over 24 hours old = abandoned (the `Flutterwave Pending Txn Poll` job
        re-checks Pending rows only between 90 seconds and 24 hours old); any
        other value (`Completed/Failed`, `Refunded`, `Timeout`) is neutral and
        must never be shown as paid or failed.
      security:
        - bearerAuth: []
      parameters:
        - name: limit
          in: query
          required: false
          schema: { type: integer, minimum: 1, maximum: 50, default: 20 }
        - name: cursor
          in: query
          required: false
          description: Opaque cursor from a previous response's `nextCursor`. Never construct one.
          schema: { type: string, maxLength: 200 }
        - name: type
          in: query
          required: false
          description: Comma-separated transaction types (exact, case-sensitive).
          schema: { type: string }
          example: Wallet Top-Up
        - name: status
          in: query
          required: false
          description: Comma-separated statuses (exact, case-sensitive), e.g. `Success,Failed`.
          schema: { type: string }
          example: Success,Failed
        - name: from
          in: query
          required: false
          description: Inclusive start date, UTC (`yyyy-MM-dd`).
          schema: { type: string, format: date }
        - name: to
          in: query
          required: false
          description: Inclusive end date, UTC (`yyyy-MM-dd`); covers the whole day.
          schema: { type: string, format: date }
      responses:
        "200":
          description: A page of transactions.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WalletTransactionList"
              examples:
                populated:
                  value:
                    items:
                      - { id: "a36XX000000EXMPLAA", reference: "TOPUP-001XX000003DHPhQAO-1790000000000", type: "Wallet Top-Up", status: "Success", paymentSource: "Flutterwave", amount: 50, creditApplied: true, createdAt: "2026-01-15T09:30:00.000Z" }
                      - { id: "a36XX000000EXMPLAB", reference: null, type: "Wallet Top-Up", status: "Success", paymentSource: "MoMo-MTN", amount: null, creditApplied: false, createdAt: "2026-01-10T08:00:00.000Z" }
                    nextCursor: "MTc5MDAwMDAwMDAwMHxhMzZYWDAwMDAwMEVYTVBMQUE"
                empty:
                  value: { items: [], nextCursor: null }
        "400":
          description: A query parameter is malformed or has an unknown value.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example: { error: "Invalid query parameter" }
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          description: Token is missing `contactId`/`accountId` claims, or the caller is not a Sponsor.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              examples:
                registrationIncomplete:
                  value: { error: "Registration incomplete" }
                notSponsor:
                  value: { error: "This action requires the Sponsor role" }
        "500":
          $ref: "#/components/responses/InternalError"
        "502":
          description: Salesforce returned an unexpected error. The upstream body is not forwarded.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example: { error: "Failed to fetch wallet transactions" }

  /wallet/transactions/{id}:
    get:
      tags: [Wallet]
      operationId: getWalletTransaction
      summary: Get one wallet transaction
      description: >-
        One wallet transaction for the calling Sponsor's account. Read-only.
        **Sponsor role only** (any other role gets `403`). Requires an ID token
        carrying `contactId`/`accountId` claims.

        Ids are opaque strings compared exactly. A 15-character id is accepted
        in the path, but the response `id` is always the 18-character form.

        `404` is deliberately identical for a transaction that does not exist,
        one that belongs to another account, and an id that is not a wallet
        transaction id. A malformed id is `400`. Same item shape, scope
        (wallet ledger rows only, account-level) and status handling as
        `GET /wallet/transactions`; `amount` and `reference` can be null, and
        currency and the Email field are never returned.
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          description: Transaction id from the list (15 or 18 letters/digits).
          schema: { type: string, pattern: "^([A-Za-z0-9]{15}|[A-Za-z0-9]{18})$" }
          example: a36XX000000EXMPLAA
      responses:
        "200":
          description: The transaction.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WalletTransaction"
              example: { id: "a36XX000000EXMPLAA", reference: "TOPUP-001XX000003DHPhQAO-1790000000000", type: "Wallet Top-Up", status: "Success", paymentSource: "Flutterwave", amount: 50, creditApplied: true, createdAt: "2026-01-15T09:30:00.000Z" }
        "400":
          description: The id is malformed.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example: { error: "A valid transaction id is required" }
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          description: Token is missing `contactId`/`accountId` claims, or the caller is not a Sponsor.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              examples:
                registrationIncomplete:
                  value: { error: "Registration incomplete" }
                notSponsor:
                  value: { error: "This action requires the Sponsor role" }
        "404":
          description: Not found, belongs to another account, or not a wallet transaction id (all identical).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example: { error: "Transaction not found" }
        "500":
          $ref: "#/components/responses/InternalError"
        "502":
          description: Salesforce returned an unexpected error. The upstream body is not forwarded.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example: { error: "Failed to fetch wallet transaction" }

  /wallet/topups/{reference}:
    get:
      tags: [Wallet]
      operationId: getWalletTopUpStatus
      summary: Poll the status of a wallet top-up
      description: >-
        Returns the status of one wallet top-up, identified by the
        `gatewayReference` returned from `POST /wallet/topup`. The app polls
        this after the Flutterwave checkout redirect until `status` is
        `Success` or `Failed`. Read-only.

        **Sponsor role only** (any other role gets `403`). Requires an ID token
        carrying `contactId`/`accountId` claims.

        **Currency is intentionally omitted** pending the LRD/NGN decision.
        `amount` is the amount recorded at initiation, not
        a value re-read from the payment provider.

        A reference that does not exist and a reference that belongs to another
        account both return the same `404`, so existence is never revealed. Only
        Wallet Top-Up transactions are returned.
      security:
        - bearerAuth: []
      parameters:
        - name: reference
          in: path
          required: true
          description: The `gatewayReference` from `POST /wallet/topup` (1-255 chars, letters, digits, `_` and `-`).
          schema: { type: string, pattern: "^[A-Za-z0-9_-]{1,255}$" }
          example: TOPUP-001XX000003DHPhQAO-1790000000000
      responses:
        "200":
          description: Top-up status.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WalletTopUpStatus"
              examples:
                credited:
                  value: { reference: "TOPUP-001XX000003DHPhQAO-1790000000000", status: "Success", amount: 50, creditApplied: true, updatedAt: "2026-01-15T09:30:20.000Z" }
                pending:
                  value: { reference: "TOPUP-001XX000003DHPhQAO-1790000600000", status: "Pending", amount: 50, creditApplied: false, updatedAt: "2026-01-14T17:20:00.000Z" }
        "400":
          description: The reference is malformed.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example: { error: "A valid top-up reference is required" }
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          description: Token is missing `contactId`/`accountId` claims, or the caller is not a Sponsor.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              examples:
                registrationIncomplete:
                  value: { error: "Registration incomplete" }
                notSponsor:
                  value: { error: "This action requires the Sponsor role" }
        "404":
          description: No such top-up on the caller's account (also returned for another account's reference).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example: { error: "Top-up not found" }
        "500":
          $ref: "#/components/responses/InternalError"
        "502":
          description: Salesforce returned an unexpected error. The upstream body is not forwarded.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example: { error: "Failed to fetch top-up status" }

  /wallet/topup:
    post:
      tags: [Wallet]
      operationId: initiateWalletTopup
      summary: Initiate a Flutterwave wallet top-up
      description: >-
        Single endpoint that starts a wallet top-up end to end: creates a
        Pending transaction record in Salesforce, then immediately initializes the
        actual payment with Flutterwave's API using the SAME reference Salesforce
        just generated as `tx_ref` — so the server can later match Flutterwave's
        payment-succeeded callback back to this exact transaction. The RN app
        gets back a single response with everything needed to launch checkout;
        no separate manual Flutterwave call is required.

        Requires an ID token carrying `contactId`/`accountId` claims (i.e. a
        completed `POST /register`) — Salesforce's own role check additionally
        requires the `Sponsor` role specifically, since dependents don't hold a
        wallet. Note this Cloud Function does not itself pre-check
        `contactId`/`accountId` presence the way sibling endpoints do — an
        unregistered caller's token is still forwarded to Salesforce, where
        Salesforce's own role check rejects it instead.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [amount]
              properties:
                amount:
                  type: number
                  description: Positive top-up amount, in the wallet's local currency.
                  example: 2500
            example:
              amount: 2500
      responses:
        "200":
          description: Transaction created in Salesforce and payment initialized with Flutterwave.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TopUpResult"
              example:
                transactionId: "a0BXX000004TmiRQAS"
                gatewayReference: "TOPUP-001XX000003DHPhQAO-1794355200000"
                amount: 2500
                checkoutLink: "https://checkout.flutterwave.com/v3/hosted/pay/abcd1234"
        "400":
          description: "`amount` missing, non-numeric, or not a positive number."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                error: "A valid positive amount is required"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          description: >-
            Passthrough from Salesforce — no wallet exists for
            this caller's Account.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorWithDetail"
              example:
                error: "Could not create top-up transaction"
                detail: "{\"error\":\"No wallet found for this account\"}"
        "500":
          description: >-
            Could not reach Salesforce at all, or the Salesforce transaction was
            created but the subsequent Flutterwave call itself failed to
            complete (network-level, not a Flutterwave-returned error).
          content:
            application/json:
              schema:
                anyOf:
                  - $ref: "#/components/schemas/Error"
                  - $ref: "#/components/schemas/TopUpPartialFailure"
              examples:
                sfError:
                  summary: Could not reach Salesforce at all
                  value: { error: "Internal error contacting Salesforce" }
                flutterwaveError:
                  summary: Salesforce transaction created, but the Flutterwave call itself errored
                  value:
                    error: "Internal error contacting Flutterwave"
                    transactionId: "a0BXX000004TmiRQAS"
        "502":
          description: >-
            Either the Salesforce Apex REST call returned an unexpected non-2xx,
            non-404 response — e.g. a non-Sponsor caller is
            refused — or Salesforce succeeded but
            Flutterwave rejected the payment initialization itself.
          content:
            application/json:
              schema:
                anyOf:
                  - $ref: "#/components/schemas/ErrorWithDetail"
                  - $ref: "#/components/schemas/TopUpPartialFailure"
              examples:
                salesforceRejected:
                  summary: Salesforce Apex REST call failed, e.g. caller isn't a Sponsor
                  value:
                    error: "Could not create top-up transaction"
                    detail: "{\"error\":\"This action requires role: Sponsor\"}"
                flutterwaveRejected:
                  summary: Salesforce transaction created, but Flutterwave itself rejected the payment
                  value:
                    error: "Payment could not be initiated"
                    transactionId: "a0BXX000004TmiRQAS"

  /medical-record:
    get:
      tags: [Account Data (Tier 1)]
      operationId: getMedicalRecord
      summary: Get a patient's medical record
      description: >-
        Returns the medical record for the patient identified by the required
        `patientContactId` query parameter. Authorization (and how much detail
        comes back) depends on the caller's role:

        - **Patient/Dependent**: `patientContactId` must be their OWN contactId.
          Full detail, including `knownConditions`/`knownAllergies`.
        - **Sponsor**: `patientContactId` must be a DEPENDENT's contactId under
          the caller's own Account. Summary only — `knownConditions` and
          `knownAllergies` are omitted — and further gated by a per-patient access
          flag, which can revoke a Sponsor's access to one patient's record independent of
          the Account relationship (`403 Payer access has been revoked for this
          record` if so).
        - **Doctor/Nurse**: `patientContactId` can be ANY patient this specific
          provider
          has an on-file visit for (as the attending provider) — not limited to
          patients under any particular Account. Full detail, same as a
          Patient viewing their own record. There's no endpoint in this API
          for creating that Visit Record relationship; it has to already exist
          in Salesforce.

        Requires an ID token carrying a `contactId` claim (see
        `CallerIdentity`) — deliberately NOT `accountId` too, since a
        provider's role-specific authorization above never uses it.
      parameters:
        - name: patientContactId
          in: query
          required: true
          description: Salesforce Contact Id of the patient whose record to fetch.
          schema:
            type: string
          example: "003XX000004TmiRQAS"
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Medical record retrieved.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MedicalRecord"
              examples:
                fullAccess:
                  summary: Patient, Dependent, or Doctor/Nurse view
                  value:
                    recordCreatedDate: "2025-03-10"
                    totalVisitsOnRecord: 4
                    lastVisitDate: "2026-09-12"
                    knownConditions: "Asthma"
                    knownAllergies: "Penicillin"
                sponsorSummary:
                  summary: Sponsor view — clinical detail omitted
                  value:
                    recordCreatedDate: "2025-03-10"
                    totalVisitsOnRecord: 4
                    lastVisitDate: "2026-09-12"
                    knownConditions: null
                    knownAllergies: null
        "400":
          description: "`patientContactId` query parameter was missing."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                error: "patientContactId query parameter is required"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          description: >-
            The caller's token is missing a `contactId` claim, OR the caller
            isn't authorized for this specific `patientContactId` per the
            role-based rules above.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              examples:
                registrationIncomplete:
                  value: { error: "Registration incomplete" }
                notAuthorized:
                  summary: >-
                    Wrong relationship for the role (not the caller's own
                    contactId, not their dependent, or — for a provider — no
                    matching visit on file with this patient)
                  value: { error: "Failed to fetch medical record", detail: "{\"error\":\"Not authorized to view this medical record\"}" }
                payerAccessRevoked:
                  summary: Sponsor's access to this specific patient's record was explicitly revoked
                  value: { error: "Failed to fetch medical record", detail: "{\"error\":\"Payer access has been revoked for this record\"}" }
        "404":
          description: >-
            No medical record exists yet for that Contact — expected until one is
            created (there is no create-record endpoint in this API).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorWithDetail"
              example:
                error: "Failed to fetch medical record"
                detail: "NOT_FOUND"
        "500":
          $ref: "#/components/responses/InternalError"
        "502":
          description: The Salesforce Apex REST call returned an unexpected non-2xx, non-403, non-404 response.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorWithDetail"
              example:
                error: "Failed to fetch medical record"
                detail: "INTERNAL_SERVER_ERROR"

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: >-
        A Firebase **ID token** (never the custom token returned by
        `POST /otp/verify` or `POST /login` — see the top-level "Two-step token
        flow" note). The server verifies it with `admin.auth().verifyIdToken()`.
        Its decoded payload may carry `contactId`, `accountId`, and `role` custom
        claims — see `CallerIdentity` — which several endpoints additionally
        require to be present, returning `403 Registration incomplete` otherwise.

    internalSecret:
      type: apiKey
      in: header
      name: x-internal-secret
      description: >-
        A shared secret, NOT a Firebase credential — used only by
        `POST /internal/send-push`, which Salesforce's `PushNotificationSender`
        calls server-to-server. Must match the `INTERNAL_PUSH_SECRET`
        environment variable configured on Render exactly. This scheme is not
        part of the mobile app's authentication model at all.

  schemas:
    HealthStatus:
      type: object
      required: [status, time]
      properties:
        status: { type: string, const: ok }
        time: { type: string, format: date-time }

    SalesforceHealthStatus:
      type: object
      required: [status, instanceUrl, sampleLimit]
      properties:
        status: { type: string, const: connected }
        instanceUrl: { type: string, format: uri }
        sampleLimit:
          type: integer
          description: "Sampled from Salesforce's DailyApiRequests limit, as a connectivity smoke test."

    Error:
      type: object
      required: [error]
      properties:
        error:
          type: string
          description: Human-readable error message.

    ErrorWithDetail:
      description: >-
        An Error whose `detail` field carries the raw response body (or a short
        code) from the upstream Salesforce Apex REST call.
      allOf:
        - $ref: "#/components/schemas/Error"
        - type: object
          properties:
            detail:
              type: string

    DeadDeviceTokenError:
      description: >-
        Returned by `POST /internal/send-push` when FCM reports the target
        device token is fake, expired, or the app was uninstalled — distinct
        from other failures so the Apex caller can clear the stored token
        instead of retrying against one that will never work.
      allOf:
        - $ref: "#/components/schemas/Error"
        - type: object
          required: [code]
          properties:
            code:
              type: string
              description: The raw FCM error code.
              examples: ["messaging/invalid-registration-token", "messaging/registration-token-not-registered"]

    PartialSuccessError:
      description: >-
        Returned when a Salesforce write (registration or dependent claim)
        succeeded but a subsequent local step (storing the password) failed —
        the Salesforce Contact/link already exists even though this is an error
        response.
      allOf:
        - $ref: "#/components/schemas/Error"
        - type: object
          required: [contactId]
          properties:
            contactId:
              type: string
              description: The Salesforce Contact Id that was successfully created/linked.

    SuccessResponse:
      type: object
      required: [success]
      properties:
        success: { type: boolean, const: true }

    PushSendResult:
      description: Success response for `POST /internal/send-push`.
      type: object
      required: [success, messageId]
      properties:
        success: { type: boolean, const: true }
        messageId:
          type: string
          description: The FCM message id, as returned by `admin.messaging().send()`.

    CustomTokenResponse:
      type: object
      required: [customToken]
      properties:
        customToken:
          type: string
          description: >-
            A Firebase custom token. Not usable directly as a Bearer credential —
            see the top-level "Two-step token flow" note.

    CallerIdentity:
      description: >-
        Not a request/response body — this documents the Firebase custom claims
        embedded in the JWT payload of a caller's ID token, which the server reads
        via `admin.auth().verifyIdToken()` and checks on most protected endpoints.
        These claims are set once by `POST /register` (Sponsor),
        `POST /dependent/claim` (Dependent), or `POST /provider/claim`
        (Doctor/Nurse), and are absent on any ID token minted before that
        completes. Most endpoints require `contactId` alone; a few
        (`GET /subscription/status`, `GET /wallet/balance`, `POST /wallet/topup`)
        additionally require `accountId`, since those are Account/Sponsor-scoped
        concepts a provider has no use for. Either kind of gate returns
        `403 { "error": "Registration incomplete" }` when the claim(s) it
        checks are missing.
      type: object
      properties:
        contactId:
          type: string
          description: Salesforce Contact Id for this caller.
        accountId:
          type: string
          description: >-
            Salesforce Account Id this caller's Contact belongs to. NEVER
            present when `role` is `"Doctor"`/`"Nurse"` — providers have no
            Account relationship (see `POST /provider/claim`). `GET /me` and
            `GET /medical-record` are deliberately `contactId`-only for this
            reason, since neither actually needs `accountId` on the Salesforce
            side; `GET /subscription/status`, `GET /wallet/balance`, and
            `POST /wallet/topup` still require it, so a provider's token is
            correctly rejected by those.
        role:
          type: string
          description: >-
            The caller's role as assigned by Salesforce at registration/claim
            time. Observed values: `"Sponsor"` (via `POST /register`),
            `"Dependent"` (via `POST /dependent/claim`), and `"Doctor"`/`"Nurse"`
            (via `POST /provider/claim`).
          examples: ["Sponsor", "Dependent", "Doctor", "Nurse"]
        phone_number:
          type: string
          description: Standard Firebase Auth claim — the verified E.164 phone number, when present.
          example: "+231770000001"
        uid:
          type: string
          description: Standard Firebase Auth claim — the Firebase user id.

    RegistrationResult:
      description: >-
        Common shape returned by both `POST /register` and
        `POST /dependent/claim` on success — this is the Salesforce Apex REST
        response, passed through as-is.
      type: object
      required: [contactId, accountId, role, wasExisting]
      properties:
        contactId: { type: string }
        accountId: { type: string }
        role: { type: string, examples: ["Sponsor", "Dependent"] }
        wasExisting:
          type: boolean
          description: Whether this Contact already existed in Salesforce prior to this call.

    ProviderClaimResult:
      description: >-
        Success response for `POST /provider/claim`. Deliberately has NO
        `accountId` field, unlike `RegistrationResult` — providers have no
        Salesforce Account relationship.
      type: object
      required: [contactId, careTeamMemberId, role, wasExisting]
      properties:
        contactId: { type: string }
        careTeamMemberId:
          type: string
          description: Salesforce Id of the provider's profile record.
        role:
          type: string
          examples: ["Doctor", "Nurse"]
        wasExisting:
          type: boolean
          description: >-
            True if this provider had already been claimed previously (this
            call is idempotent, not an error, in that case).

    TopUpResult:
      description: >-
        Success response for `POST /wallet/topup` — combines the Salesforce
        Pending transaction with the Flutterwave checkout link in one payload.
      type: object
      required: [transactionId, gatewayReference, amount, checkoutLink]
      properties:
        transactionId:
          type: string
          description: Salesforce Id of the new transaction record.
        gatewayReference:
          type: string
          description: >-
            Also used as Flutterwave's `tx_ref` — this is what
            the server matches the later payment callback against.
        amount:
          type: number
        checkoutLink:
          type: string
          format: uri
          description: Flutterwave-hosted checkout URL to open/redirect the user to.

    TopUpPartialFailure:
      description: >-
        Returned when the Salesforce Pending transaction was already created
        but a later step (initializing the real payment with Flutterwave)
        failed or errored — the transaction is not silently orphaned; it stays
        Pending until reconciled or retried.
      allOf:
        - $ref: "#/components/schemas/Error"
        - type: object
          required: [transactionId]
          properties:
            transactionId:
              type: string
              description: The Salesforce transaction Id created before the failure.

    DependentRecord:
      description: >-
        Response shape for `POST /dependent/register`, passed through from the
        Salesforce `dependent/register` Apex REST endpoint as-is. The exact field
        list is defined by that Apex controller (not present in this repo) —
        fields below reflect the currently known contract; confirm against the
        Apex source before relying on any field not listed here.
      type: object
      additionalProperties: true
      properties:
        contactId: { type: string }
        accountId: { type: string }
      example:
        contactId: "003XX000004TmiRQAS"
        accountId: "001XX000003DHPhQAO"
        firstName: "Anthony"
        lastName: "Doe"
        phone: "+231770000002"

    ProfileRecord:
      description: Response shape for `GET /me`.
      type: object
      required: [contactId, accountId, firstName, lastName, phone, email, role, isPrimaryContact, accountType, accountName]
      properties:
        contactId: { type: string }
        accountId: { type: [string, "null"], description: "Null for providers, who have no Account." }
        firstName: { type: [string, "null"] }
        lastName: { type: string }
        phone: { type: [string, "null"] }
        email: { type: [string, "null"] }
        role: { type: string, description: "Sponsor, Patient, Doctor or Nurse." }
        isPrimaryContact: { type: [boolean, "null"] }
        accountType: { type: [string, "null"] }
        accountName: { type: [string, "null"] }
      example:
        contactId: "003XX000004TmiQQAS"
        accountId: "001XX000003DHPhQAO"
        firstName: "John"
        lastName: "Doe"
        phone: "+231770000001"
        email: "johndoe@example.com"
        role: "Sponsor"
        isPrimaryContact: true
        accountType: "Sponsor"
        accountName: "John Doe"
    SubscriptionStatus:
      description: Response shape for `GET /subscription/status`.
      type: object
      required: [status, planType, visitsRemaining, renewalDate]
      properties:
        status:
          type: [string, "null"]
          description: "One of Active, Pending, Paused/ Suspended, Expired, Cancelled. For display only: to decide whether care can be requested use GET /care-requests/eligibility and its reasonCode."
          example: "Active"
        planType: { type: [string, "null"], description: "Plan label, e.g. Sponsor ($150)." }
        visitsRemaining: { type: [number, "null"], description: "Visits left in the current period." }
        renewalDate: { type: [string, "null"], format: date, description: "Next renewal date (yyyy-MM-dd)." }
    WalletBalance:
      description: Response shape for `GET /wallet/balance`. No currency is returned pending the currency decision.
      type: object
      required: [currentBalance, lowBalanceThreshold, walletStatus]
      properties:
        currentBalance: { type: [number, "null"] }
        lowBalanceThreshold: { type: [number, "null"], description: "Balance at which a low-balance alert is sent; null if not set." }
        walletStatus: { type: [string, "null"], description: "Active, Frozen or Closed; null on older wallets." }
    DependentList:
      description: "Response of `GET /dependents`. List endpoints share the `{ items: [...] }` convention (no cursor)."
      type: object
      required: [items]
      properties:
        items:
          type: array
          maxItems: 200
          items:
            type: object
            required: [id, firstName, lastName, claimed, appAccountCreated]
            properties:
              id: { type: string, description: Salesforce Contact Id. }
              firstName: { type: [string, "null"] }
              lastName: { type: string }
              claimed:
                type: boolean
                description: True when the dependent has signed in and linked their own login. No login identifier is ever returned.
              appAccountCreated:
                type: boolean
                description: True once the dependent's app account has been created.

    WalletTransaction:
      description: One wallet ledger row. No currency and no email field by design.
      type: object
      required: [id, reference, type, status, paymentSource, amount, creditApplied, createdAt]
      properties:
        id: { type: string }
        reference: { type: [string, "null"], description: "Payment reference; null on some older records." }
        type: { type: [string, "null"], description: "Transaction type, e.g. Wallet Top-Up." }
        status:
          type: string
          description: >-
            Status verbatim. Success = paid, Failed = failed, Pending = processing
            (under 24h) or abandoned (over 24h); any other value is neutral.
        paymentSource: { type: [string, "null"], description: "Payment source, e.g. Flutterwave or MoMo-MTN." }
        amount: { type: [number, "null"], description: Amount recorded at initiation. }
        creditApplied: { type: boolean, description: True once the wallet balance has been credited. }
        createdAt: { type: string, format: date-time, description: CreatedDate, UTC. }

    WalletTransactionList:
      description: Response of `GET /wallet/transactions`.
      type: object
      required: [items, nextCursor]
      properties:
        items:
          type: array
          maxItems: 50
          items:
            $ref: "#/components/schemas/WalletTransaction"
        nextCursor:
          type: [string, "null"]
          description: Opaque; pass back as `cursor` for the next page. Null on the last page.

    ProviderProfile:
      description: Response of `GET /provider/me`. Bank/payout and licence data are never included.
      type: object
      required: [providerType, specialisation, vettingStatus, onDuty, availabilityStatus, rating, totalCompletedVisits, totalDispatches, averageResponseTimeMins]
      properties:
        providerType: { type: [string, "null"], enum: [Doctor, Nurse, null] }
        specialisation: { type: [string, "null"] }
        vettingStatus:
          type: [string, "null"]
          description: "Pending = awaiting admin approval; Vetted = approved; Suspended = admin-set. Other/null = neutral blocked screen."
          example: Vetted
        onDuty: { type: boolean }
        availabilityStatus:
          type: [string, "null"]
          description: Available, Busy or Off Duty; null if never set.
        rating: { type: [number, "null"], description: "2 decimals; null today (nothing populates it)." }
        totalCompletedVisits: { type: [integer, "null"], description: Null today. }
        totalDispatches: { type: [integer, "null"], description: Null today. }
        averageResponseTimeMins: { type: [integer, "null"], description: Null today. }

    ProviderAvailabilityRequest:
      type: object
      additionalProperties: false
      required: [onDuty]
      properties:
        onDuty:
          type: boolean
          description: "`false` always results in `Off Duty`."
        availabilityStatus:
          type: string
          enum: [Available, Busy, Off Duty]
          description: "Optional. Defaults to `Available` when on duty. `Off Duty` is not allowed together with `onDuty: true`."
    ProviderAvailability:
      type: object
      required: [onDuty, availabilityStatus]
      properties:
        onDuty:
          type: boolean
        availabilityStatus:
          type: string
          enum: [Available, Busy, Off Duty]
    ProviderLocationRequest:
      type: object
      additionalProperties: false
      required: [latitude, longitude]
      properties:
        latitude:
          type: number
          minimum: -90
          maximum: 90
        longitude:
          type: number
          minimum: -180
          maximum: 180
      description: Exactly `0,0` is rejected as a placeholder.
    ProviderLocationUpdated:
      type: object
      required: [updatedAt]
      properties:
        updatedAt:
          type: string
          format: date-time
          description: When the position was saved (UTC, millisecond precision).
    ProviderWriteError:
      type: object
      required: [error]
      properties:
        error:
          type: string
        code:
          type: string
          enum: [INVALID_REQUEST, NOT_VETTED, STATUS_CONFLICT, INVALID_LOCATION, RATE_LIMITED, NOT_ACCEPTABLE, NOT_REJECTABLE]
    DispatchListItem:
      type: object
      required: [id, careRequestId, status, landmark, symptoms, distanceKm, secondsLeft, phone, latitude, longitude]
      properties:
        id:
          type: string
          description: Dispatch id, for `accept`/`reject`.
        careRequestId:
          type: string
        status:
          type: string
          enum: [Pending, Accepted]
        landmark:
          type: [string, "null"]
        symptoms:
          type: [string, "null"]
        distanceKm:
          type: [number, "null"]
          description: Pending only; null on an Accepted row, and null if either side has no GPS yet.
        secondsLeft:
          type: [integer, "null"]
          description: Pending only; null on an Accepted row, floored at 0, and null if the window has no start time yet.
        phone:
          type: [string, "null"]
          description: Accepted only; null on a Pending row.
        latitude:
          type: [number, "null"]
          description: Accepted only; null on a Pending row.
        longitude:
          type: [number, "null"]
          description: Accepted only; null on a Pending row.
    DispatchList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/DispatchListItem"
    DispatchActionResult:
      type: object
      required: [status]
      properties:
        status:
          type: string
          enum: [Accepted, Declined]
    CareRequestEligibility:
      description: Advisory result of `GET /care-requests/eligibility`. Enforcement stays in Salesforce at create time.
      type: object
      required: [eligible, reasonCode, visitsRemaining, subscriptionStatus]
      properties:
        eligible: { type: boolean }
        reasonCode:
          type: [string, "null"]
          description: Null when eligible. Treat an unknown future value as "not eligible".
          enum: [NO_SUBSCRIPTION, SUBSCRIPTION_PENDING, SUBSCRIPTION_SUSPENDED, SUBSCRIPTION_EXPIRED, SUBSCRIPTION_CANCELLED, VISITS_EXHAUSTED, SUBSCRIPTION_INACTIVE, null]
        visitsRemaining: { type: [integer, "null"], description: Null when there is no subscription. }
        subscriptionStatus:
          type: [string, "null"]
          description: Raw subscription status (e.g. "Paused/ Suspended"). For display or logging only; never branch on it, use reasonCode.

    CreateCareRequestBody:
      type: object
      required: [symptoms, latitude, longitude]
      properties:
        patientContactId:
          type: string
          description: Sponsors only, to request for a dependent. Omit to request for yourself. A Patient may only send their own id.
          example: "003XX00001QMgFvYAL"
        symptoms:
          type: string
          maxLength: 2000
          example: "Fever and headache since yesterday"
        landmark:
          type: string
          maxLength: 255
          example: "Near the Waterside market"
        latitude:
          type: number
          minimum: -90
          maximum: 90
          description: The PATIENT's latitude (never the sponsor's device). Must be inside the service area.
          example: 6.3005
        longitude:
          type: number
          minimum: -180
          maximum: 180
          description: The PATIENT's longitude (never the sponsor's device). Must be inside the service area.
          example: -10.7969
    CareRequestCreated:
      type: object
      required: [id, status, confirmationCode, createdAt, dispatchState]
      properties:
        id:
          type: string
          example: "a0dXX000001AbCdYAK"
        status:
          type: string
          description: Status right after creation (Submitted or Dispatched); on a replay it may have moved on.
          example: "Dispatched"
        confirmationCode:
          type: [string, "null"]
          description: 6-character code the patient shows the provider.
          example: "K7Q2ZM"
        createdAt:
          type: string
          format: date-time
          example: "2026-09-30T08:15:00.000Z"
        dispatchState:
          type: [string, "null"]
          enum: [PENDING_DISPATCH, DISPATCHED, null]
          description: PENDING_DISPATCH means saved and still finding a provider; DISPATCHED means a provider was notified. Null on a replay once the request has moved on. Neither means a provider accepted.
    CareRequestError:
      type: object
      required: [error]
      properties:
        error:
          type: string
        code:
          type: string
          enum: [INVALID_REQUEST, PATIENT_NOT_FOUND, OPEN_REQUEST_EXISTS, NOT_ELIGIBLE, IDEMPOTENCY_KEY_CONFLICT, OUTSIDE_SERVICE_AREA, UNEXPECTED_STATE]
        existingRequestId:
          type: string
          description: With OPEN_REQUEST_EXISTS, the request to open instead of creating another.
        reasonCode:
          type: string
          description: With NOT_ELIGIBLE, see the endpoint description for the list.
        id:
          type: string
          description: With UNEXPECTED_STATE, the request that was created.
        status:
          type: string
          description: With UNEXPECTED_STATE, its status.
    CareRequestPatientRef:
      type: object
      required: [id, name]
      properties:
        id: { type: string, example: "003XX00001PhybaYAB" }
        name: { type: [string, "null"], example: "Anthony Doe" }
    CareRequestProviderCard:
      type: [object, "null"]
      description: Null until a provider is assigned. Never includes phone or location.
      properties:
        name: { type: [string, "null"], example: "Dora Doc" }
        type: { type: [string, "null"], example: "Doctor" }
        rating: { type: [number, "null"], example: 4.5 }
    CareRequestListItem:
      type: object
      required: [id, status, createdAt, patient, provider]
      properties:
        id: { type: string, example: "a2vXX000001AbCdYAK" }
        status: { type: string, example: "Dispatched" }
        createdAt: { type: string, format: date-time }
        patient: { $ref: "#/components/schemas/CareRequestPatientRef" }
        provider: { $ref: "#/components/schemas/CareRequestProviderCard" }
    CareRequestList:
      type: object
      required: [items, nextCursor]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/CareRequestListItem" }
        nextCursor:
          type: [string, "null"]
          description: Null on the last page.
    CareRequestDetail:
      type: object
      required: [id, status, createdAt, symptoms, landmark, patient, provider, confirmationCode]
      properties:
        id: { type: string, example: "a2vXX000001AbCdYAK" }
        status: { type: string, example: "Dispatched" }
        createdAt: { type: string, format: date-time }
        symptoms: { type: [string, "null"] }
        landmark: { type: [string, "null"] }
        patient: { $ref: "#/components/schemas/CareRequestPatientRef" }
        provider: { $ref: "#/components/schemas/CareRequestProviderCard" }
        confirmationCode:
          type: [string, "null"]
          description: Only while the status is Submitted, Dispatched or Provider Accepted; null in every other status.
          example: "K7Q2ZM"
    WalletTopUpStatus:
      description: >-
        Response of `GET /wallet/topups/{reference}`. No currency field: it is
        intentionally omitted pending the LRD/NGN decision.
      type: object
      required: [reference, status, amount, creditApplied, updatedAt]
      properties:
        reference: { type: string }
        status:
          type: string
          description: Transaction status, value verbatim.
          example: Success
        amount:
          type: [number, "null"]
          description: Amount recorded at initiation.
        creditApplied:
          type: boolean
          description: True once the wallet balance has been credited.
        updatedAt: { type: string, format: date-time }

    MedicalRecord:
      description: >-
        Response shape for `GET /medical-record` — matches the
        server response exactly.
        `knownConditions`/`knownAllergies` are free-text strings (not arrays),
        and are `null` for Sponsor-role callers (summary view) — Patient/Dependent and Doctor/Nurse callers get both fields
        populated.
      type: object
      required: [recordCreatedDate, totalVisitsOnRecord, lastVisitDate]
      properties:
        recordCreatedDate: { type: string, format: date }
        totalVisitsOnRecord: { type: integer }
        lastVisitDate: { type: [string, "null"], format: date }
        knownConditions:
          type: [string, "null"]
          description: Free-text. Null/absent for Sponsor-role callers.
        knownAllergies:
          type: [string, "null"]
          description: Free-text. Null/absent for Sponsor-role callers.
      example:
        recordCreatedDate: "2025-03-10"
        totalVisitsOnRecord: 4
        lastVisitDate: "2026-09-12"
        knownConditions: "Asthma"
        knownAllergies: "Penicillin"

  responses:
    Unauthorized:
      description: The Authorization header was missing, or the ID token is invalid/expired.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
          examples:
            missingHeader:
              value: { error: "Missing Authorization header" }
            invalidToken:
              value: { error: "Invalid or expired token" }

    RegistrationIncomplete:
      description: >-
        The presented ID token does not carry `contactId`/`accountId` claims yet
        — see `CallerIdentity`. Complete `POST /register` (Sponsor) or
        `POST /dependent/claim` (Dependent) first.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
          example:
            error: "Registration incomplete"

    InternalError:
      description: Unexpected server-side error unrelated to Salesforce's response.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
          example:
            error: "Internal error"
